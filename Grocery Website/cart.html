<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>
    <style>
        body {
            padding: 0px;
            background: #f5f5f5;
            font-family: 'Trebuchet MS','Lucida Sans Unicode','Lucida Grande','Lucida Sans',Arial,sans-serif
        }

        header {
            background: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #0c831f;
        }

        .header-actions button {
            background: #0c831f;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .header-actions a{
            text-decoration:none;
        }

        h1 {
            margin-bottom: 20px;
        }

        .cart-item {
            background: #fff;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cart-item img{
            width:120px;
            height:100px;
        }

        button {
            background: #0c831f;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 5px;
        }

        .total {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">DailyEssentials</div>

    <div class="header-actions">
        <a href="index.html">
            <button>Home</button>
        </a>
        <a href="login.html">
            <button>Login</button>
        </a>
    </div>
</header>

<h1>Your Cart</h1>
<div id="cart-items"></div>
<div class="total" id="total"></div>
<button onclick="clearCart()">Clear Cart</button>
<button onclick="checkout()">Order Now!</button>

<script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let container = document.getElementById("cart-items");
    let total = 0;

    if (cart.length === 0) {
        container.innerHTML = "<p>Your cart is empty.</p>";
    } else {
        cart.forEach(item => {
            total += item.price * item.quantity;

            container.innerHTML += `
                <div class="cart-item">
                    <img src="${item.img}">
                    <div>
                        <h3>${item.name}</h3>
                        <p>Price: ₹${item.price}</p>
                        <p>Quantity: ${item.quantity}</p>
                    </div>
                </div>
            `;
        });
    }

    document.getElementById("total").innerText = "Total: ₹" + total;

    function clearCart() {
        localStorage.removeItem("cart");
        location.reload();
    }

    function checkout() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        if (cart.length === 0) {
            alert("Cart is empty");
            return;
        }
        alert("Order placed successfully! 🎉");
        cart = [];
        localStorage.setItem("cart", JSON.stringify(cart));
        clearCart()
    }
</script>

</body>
</html>
