<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Museum Ticket Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            background: linear-gradient(110deg, #cd81e4, #eabf97);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
        }

        input {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 15px;
            font-size: 16px;
        }

        .ticket-inputs {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .total-tickets {
            font-weight: bold;
        }

        .total-fare {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        button {
            width: 100%;
            height: 40px;
            border: 1px solid;
            background: #2691d9;
            border-radius: 25px;    
            font-size: 18px;
            color: #e9f4fb;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            padding: 0 20px;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #119a01;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Visitor Details</h1>
        <form id="bookingForm">
            <label for="name">Name :</label>
            <input type="text" id="name" name="name" required>

            <label for="contact">Contact Number :</label>
            <input type="tel" id="contact" name="contact" pattern="{10}" required>
            
            <label for="date">Date of Visit :</label>
            <input type="date" id="date" name="date" required>
            
            <div class="total-tickets">
                Number of Tickets : <span id="totalTickets">0</span>
            </div>

            <div class="ticket-inputs">
                <div>
                    <label for="adults">Adults :</label>
                    <input type="number" id="adults" name="adults" min="0" required>
                </div>
                <div>
                    <label for="children">Children :</label>
                    <input type="number" id="children" name="children" min="0" required>
                </div>
            </div>

            <div class="total-fare">
                Total Fare : <span id="totalFare">0.00</span>
            </div>
            
            <button type="submit">Book Tickets</button>
        </form>
    </div>

<script>
    // 🔹 Get museum details from localStorage
    const museumId = localStorage.getItem("museumId");
    const museumName = localStorage.getItem("museumName");

    // Set min date to today
    document.addEventListener('DOMContentLoaded', function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').setAttribute('min', today);
    });

    // Update totals dynamically
    function updateTotalTickets() {
        const adults = parseInt(document.getElementById('adults').value) || 0;
        const children = parseInt(document.getElementById('children').value) || 0;
        const totalTickets = adults + children;

        const farePerAdult = 450;
        const farePerChild = 150;
        const totalFare = (adults * farePerAdult) + (children * farePerChild);

        document.getElementById('totalTickets').textContent = totalTickets;
        document.getElementById('totalFare').textContent = totalFare.toFixed(2);
    }

    document.getElementById('adults').addEventListener('input', updateTotalTickets);
    document.getElementById('children').addEventListener('input', updateTotalTickets);

    // Generate Booking ID
    function generateBookingId() {
        return Math.floor(10000 + Math.random() * 90000);
    }

    // Submit booking
    document.getElementById('bookingForm').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const name = document.getElementById('name').value;
        const date = document.getElementById('date').value;
        const adults = parseInt(document.getElementById('adults').value) || 0;
        const children = parseInt(document.getElementById('children').value) || 0;
        const contact = document.getElementById('contact').value;

        const totalTickets = adults + children;
        const farePerAdult = 450;
        const farePerChild = 150;
        const totalFare = (adults * farePerAdult) + (children * farePerChild);

        const bookingId = generateBookingId();

        // 🔹 Store ticket in localStorage
        localStorage.setItem("ticketData", JSON.stringify({
            bookingId: bookingId,
            museumId: museumId,
            museum: museumName,
            name: name,
            date: date,
            adults: adults,
            children: children,
            totalTickets: totalTickets,
            totalFare: totalFare.toFixed(2),
            contact: contact
        }));

        // Redirect to ticket page
        window.location.href = 'ticket.html';
    });
</script>  

</body>
</html>
